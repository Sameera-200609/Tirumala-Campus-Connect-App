<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Tirumala Campus Connect</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
  <div class="login-box">
    <div class="logo big">TEC</div>
    <h1>Student Login</h1>
    <p class="muted">Sign in to access Campus Connect.</p>
    <form id="loginForm">
      <label>Student ID</label>
      <input id="studentId" type="text" placeholder="Enter student ID" required>
      <label>Password</label>
      <input type="password" placeholder="Enter password" required>
      <button class="btn full" type="submit">Login</button>
    </form>
    <p class="demo">Demo project: any non-empty Student ID and password will open the dashboard.</p>
    <a href="index.html">← Back to home</a>
  </div>
<script src="js/app.js"></script>
</body>
</html>
